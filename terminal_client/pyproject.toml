[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisperdoc-terminal"
version = "2.24.6"
description = "Fallback and diagnostic Python terminal client for WhisperDoc."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorama~=0.4.6",
    "keyring~=25.7.0",
    "loguru~=0.7.3",
    "numpy~=2.4.3",
    "pynput~=1.8.1",
    "pyperclip~=1.11.0",
    "python-dotenv~=1.2.2",
    "requests~=2.33.0",
    "sounddevice~=0.5.5",
    "websockets~=16.0",
]

[project.scripts]
whisperdoc-terminal = "whisper_shell.client:main"

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["whisper_shell*"]

[tool.pyright]
include = ["whisper_shell"]
exclude = [
    "tests",
    "venv",
    ".venv",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportMissingModuleSource = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
exclude = [
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["whisper_shell"]
omit = ["whisper_shell/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
]
